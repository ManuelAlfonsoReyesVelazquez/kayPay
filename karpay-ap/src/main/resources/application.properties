spring.application.name=karpay-ap
server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5432/karpay
spring.datasource.username=karpay
spring.datasource.password=karpay

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true
spring.security.user.name=admin
spring.security.user.password=admin123


# Retry
resilience4j.retry.instances.ach.max-attempts=3
resilience4j.retry.instances.ach.wait-duration=2s

# Circuit Breaker
resilience4j.circuitbreaker.instances.ach.sliding-window-size=5
resilience4j.circuitbreaker.instances.ach.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.ach.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.ach.wait-duration-in-open-state=10s


ach.simulator.url=http://localhost:8081
